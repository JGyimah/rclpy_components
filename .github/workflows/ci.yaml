name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # A plugin package calls register_nodes from its own setup.py, where the ROS
  # runtime may not be importable yet. That is why rclpy_components/__init__.py
  # imports nothing and setup_helper imports only the standard library, and it
  # is an invariant nothing else would catch breaking: every other test needs
  # ament_index_python or rclpy, so a stray import would pass CI everywhere but
  # here and fail in a plugin package's build.
  build-time:
    name: importable without ROS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest and nothing else
        run: python -m pip install pytest
      - name: Register components with no ROS on the path
        run: |
          python - <<'PY'
          import os
          import tempfile

          from rclpy_components.setup_helper import register_nodes

          directory = tempfile.mkdtemp()
          entries = register_nodes('p', {'ns::Talker': 'p.talker:Talker'}, directory=directory)

          assert entries == [(
              'share/ament_index/resource_index/rclpy_components',
              [os.path.join(directory, '.rclpy_components', 'p')],
          )], entries

          with open(entries[0][1][0]) as f:
              assert f.read() == 'ns::Talker;p.talker:Talker\n', f.read()

          print('register_nodes works with no ROS runtime')
          PY
      - name: The tests that need no ROS runtime
        run: python -m pytest test/test_setup_helper.py -v -p no:cacheprovider

  # The real thing: colcon build and test, which is what runs the container
  # against a live rclpy and what upstream CI would run.
  ros:
    name: ${{ matrix.distro }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: jazzy
            runner: ubuntu-24.04
          - distro: rolling
            runner: ubuntu-24.04
    steps:
      - uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: ${{ matrix.distro }}
      # Without this, a distro that failed to install is silence rather than a
      # failure: conftest.py drops the test modules whose dependencies are
      # missing, so the run would collect the five setup-helper tests, pass,
      # and report green having exercised no container at all.
      - name: Fail if the distro is not actually installed
        run: |
          . /opt/ros/${{ matrix.distro }}/setup.sh
          python3 -c "import ament_index_python, rclpy; print('${{ matrix.distro }} is installed')"
      - uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: rclpy_components
          target-ros2-distro: ${{ matrix.distro }}

  # Windows is where a composition container goes wrong in ways Linux does not
  # show: ros2/rclpy#599 has sat since 2024 on a Windows job that got stuck
  # rather than failed, and nothing in a Linux run would have caught it.
  #
  # This job gates. It was informational while the toolchain was being worked
  # out, and passing it is now the point: a job allowed to fail cannot catch
  # the hang coming back, which is the whole reason that pull request stalled.
  windows:
    name: jazzy on windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      # jazzy rather than rolling, because setup-ros cannot install rolling on
      # Windows at all: it extracts a published binary archive, and its table
      # of them covers humble, iron, jazzy, kilted and lyrical. A distro that
      # is not in that table is skipped by `if (rosDistro in binaryReleases)`
      # with no warning, which is what this job used to do -- it asked for
      # rolling, got no ROS, and still went green, because colcon will happily
      # run setup.py for a pure-Python package with nothing underneath it.
      # Rolling has no such archive by nature, so Windows coverage here means
      # the newest distro that has one.
      - uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy
      # The runner has Python 3.12, and the ROS 2 Windows tooling sits on the
      # wrong side of four setuptools changes at once. Each one bounds the
      # version from a different direction:
      #
      #   * vcstool imports pkg_resources, removed in setuptools 82.
      #   * colcon's setup.py probe passes --dry-run, removed in 81.
      #   * --symlink-install runs `setup.py develop --editable`, and 80 made
      #     develop a plain Command instead of an easy_install subclass, so
      #     the option went with the inheritance.
      #   * pkg_resources must guard its pkgutil.ImpImporter call, which
      #     Python 3.12 removed. 79.0.1 guards it; the runner's own does not.
      #
      # 79.0.1 is the newest release satisfying all four, and it is pinned
      # exactly rather than as `<80`. The range happens to resolve to the same
      # version today, because the 79 series stops there, but a constraint that
      # is right by accident is not a pin, and this job is offered as proof
      # that Windows works: it has to resolve the same way next month.
      #
      # No setuptools in that range ships the setuptools.extern shim the probe
      # reaches for first, which is why colcon-python-setup-py comes along —
      # 0.2.9 falls back to `packaging.specifiers` when the shim is absent. It
      # is pinned too; it was taking whatever happened to be newest.
      - name: Give the runner tooling that works on Python 3.12
        run: python -m pip install --upgrade "setuptools==79.0.1" "colcon-python-setup-py==0.2.9"
      # nose registers a distutils command, and `setup.py --help-commands`,
      # which colcon runs to see what the package can do, loads every
      # registered command. Importing nose imports `imp`, removed in Python
      # 3.12, so the probe fails on a package that has nothing to do with it.
      # nose has been unmaintained for years and nothing here uses it.
      - name: Remove nose, which cannot be imported on Python 3.12
        run: python -m pip uninstall -y nose || true
      # The same guard the Linux jobs carry, for the same reason: a distro that
      # did not install is otherwise silence rather than a failure. On Windows
      # it is the more important of the two, since setup-ros skips a distro it
      # has no archive for without saying so.
      - name: Fail if the distro is not actually installed
        shell: cmd
        run: |
          call "C:\dev\jazzy\ros2-windows\setup.bat"
          python -c "import ament_index_python, rclpy; print('jazzy is installed')"
      - uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: rclpy_components
          target-ros2-distro: jazzy
      # action-ros-ci builds on Windows and never tests: `doTests = !isWindows`
      # is hardcoded, with no input to override it, since
      # action-ros-ci/pull/712#issuecomment-969495087. It still installs pytest
      # and colcon-test-result and still reports the job green, so a Windows
      # job built on the action alone is a compile check wearing the clothes of
      # a test run. These two steps run by hand exactly what the action runs
      # for itself on Linux.
      #
      # This is the part that matters for ros2/rclpy#599, where the Windows
      # tests got stuck rather than failed. A build-only job cannot see that;
      # with timeout-minutes above, these steps turn a hang into a failure with
      # a log attached.
      - name: Test, which the action will not do on Windows
        working-directory: ros_ws
        shell: cmd
        run: |
          call "C:\dev\jazzy\ros2-windows\setup.bat"
          colcon test --packages-select rclpy_components --merge-install --event-handlers console_direct+
      # Always, so a failing test step still reports which test failed rather
      # than only that something did. --all prints every result and --verbose
      # sets the exit code, which is the order the action uses.
      - name: Report the test results
        if: always()
        working-directory: ros_ws
        shell: cmd
        run: |
          call "C:\dev\jazzy\ros2-windows\setup.bat"
          colcon test-result --all
          colcon test-result --verbose
